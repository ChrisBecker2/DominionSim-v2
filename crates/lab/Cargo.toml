[package]
name = "dominion-lab"
edition.workspace = true
version.workspace = true
description = "Strategy Lab: a native web server + single-page UI around dominion-evolve."

[lib]
name = "dominion_lab"
path = "src/lib.rs"

[[bin]]
name = "dominion-lab"
path = "src/main.rs"

[dependencies]
dominion-engine = { path = "../engine" }
dominion-sim = { path = "../sim" }
dominion-evolve = { path = "../evolve" }
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
