[package]
name = "dominion-sim"
edition.workspace = true
version.workspace = true

[lib]
name = "dominion_sim"
path = "src/lib.rs"

[[bin]]
name = "dominion-sim"
path = "src/bin/dominion_sim.rs"
required-features = ["parallel"]

[features]
default = ["parallel"]
# rayon-based batch runner + the CLI binary (needs threads/clap; not available/useful on wasm32).
parallel = ["dep:rayon", "dep:clap"]

[dependencies]
dominion-engine = { path = "../engine" }
dominion-search = { path = "../search" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
rayon = { version = "1", optional = true }
clap = { version = "4", features = ["derive"], optional = true }

[dev-dependencies]
