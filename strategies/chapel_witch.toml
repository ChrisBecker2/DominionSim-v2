# Chapel/Witch — one of the best two-card combos in the base set. Chapel trims Estates and
# Coppers down to a lean deck early (so every draw is more likely to be useful), and Witch piles
# Curses onto the opponent(s) while drawing you a card back. `keep_treasure = 3` stops Chapel
# from trashing away so much money that you can't afford Witch/Silver on the following turns.

name = "Chapel/Witch"
description = "Chapel trims the deck early; two Witches curse the opponents; Big Money after."

keep_treasure = 3

[[gain]]
card = "Province"

[[gain]]
card = "Witch"
if = "count(Witch) < 2"

[[gain]]
card = "Chapel"
if = "count(Chapel) < 1"

[[gain]]
card = "Gold"

[[gain]]
card = "Duchy"
if = "provinces_left <= 4"

[[gain]]
card = "Silver"

[[play]]
card = "Witch"

[[play]]
card = "Chapel"

# Chapel away the starting junk: Estates while the game is young, then Coppers (never below
# keep_treasure treasures in hand). Curses are always trashed by default.
[[trash]]
card = "Estate"
if = "provinces_left >= 5"

[[trash]]
card = "Copper"
