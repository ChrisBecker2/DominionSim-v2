# Double Witch — one of the strongest simple kingdom strategies: two Witches curse the
# opponent(s) hard while your own deck barely slows down (Witch cantrips a card back). Get both
# Witches before anything else, then fall back to Big Money (with a Duchy endgame, since the
# curses you hand out usually turn a money race into a lopsided one). Needs Witch in the
# kingdom — pair with `--kingdom auto` if the default "first-game" kingdom doesn't include it.
# Endgame (shared by the Big Money variants): a Province once the deck holds $15 of treasure
# (earlier greening stalls the deck); Duchy over Gold with 4 or fewer Provinces left, Estate over
# Gold with 2 or fewer; Duchy over Silver with 6 or fewer.

name = "Double Witch"
description = "Two Witches ASAP, then Big Money with a Duchy endgame."

[[gain]]
card = "Province"
if = "money >= 15"

[[gain]]
card = "Duchy"
if = "provinces_left <= 4"

[[gain]]
card = "Estate"
if = "provinces_left <= 2"

[[gain]]
card = "Witch"
if = "count(Witch) < 2"

[[gain]]
card = "Gold"

[[gain]]
card = "Duchy"
if = "provinces_left <= 6"

[[gain]]
card = "Silver"

[[play]]
card = "Witch"
