# Gardens/Workshop — the classic rush. Gardens is worth 1 VP per 10 cards you own, so the deck
# wants to be big rather than good: Workshop ($3, gain a card costing up to $4) gains a Gardens
# or another Workshop every time it is played, and each buy picks up whatever is affordable. When
# the Gardens are gone, Estates. The game usually ends on piles (Workshop, Gardens, Estate)
# before Big Money can take enough Provinces. Buys a Province when $8 turns up anyway.
# Measured with --kingdom auto: 96% against the older "Province, Gold, Gardens" version, 47%
# against Big Money Ultimate.

name = "Gardens/Workshop"
description = "Workshop/Gardens rush: gain Gardens and Workshops, then Estates; ends the game on piles."

[[gain]]
card = "Province"

[[gain]]
card = "Gardens"

[[gain]]
card = "Workshop"

[[gain]]
card = "Estate"
if = "supply(Gardens) == 0"

[[gain]]
card = "Silver"
if = "count(Silver) < 2"

[[gain]]
card = "Estate"

[[gain]]
card = "Copper"

[[play]]
card = "Workshop"
