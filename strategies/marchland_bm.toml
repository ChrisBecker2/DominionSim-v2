# Marchland + Big Money: Marchland is a Victory card worth 1 VP per 3 Victory cards, and buying it gives +1 Buy and
# $1 per card discarded, so a green hand can keep buying. Greens late, Marchland from the first Province on.

name = "Marchland-BM"
description = "Big Money that greens with Marchlands once Provinces start to run out."

[[gain]]
card = "Province"

[[gain]]
card = "Marchland"
if = "provinces_left <= 5 and count(Gold) >= 2"

[[gain]]
card = "Duchy"
if = "provinces_left <= 3"

[[gain]]
card = "Gold"

[[gain]]
card = "Estate"
if = "provinces_left <= 2"

[[gain]]
card = "Silver"
